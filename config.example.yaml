# CPA-Claude — native Anthropic Claude + OpenAI Codex proxy configuration.
#
# Every field below is optional; values shown are the built-in defaults
# applied when the key is missing. Client access tokens are NOT in this
# file — manage them from the admin panel (persisted in tokens.json
# next to state_file).

# Two independent HTTP listeners, one per upstream provider. They share
# the same client token store, usage ledger, request log, and admin
# panel — only the routes and the credential pool subset differ.
#
# The admin panel + public /status page are mounted on the "primary"
# endpoint: Claude when it's enabled, otherwise Codex.
endpoints:
  claude:
    host: "0.0.0.0"
    port: 8317
    disabled: false
  codex:
    host: "0.0.0.0"
    port: 8318
    disabled: true    # opt-in: set to false after adding Codex credentials

# trace | debug | info | warn | error
log_level: info

# Directory containing per-credential OAuth JSON files (one per Claude /
# Codex account). Each file may declare its own proxy URL and
# max_concurrent. Relative paths resolve against this file's directory.
auth_dir: ./auths

# Persistent usage statistics and session state. Survives restarts.
# tokens.json (client access tokens) is kept next to this file.
state_file: ./state.json

# Per-request JSONL log. Writes to log_dir/requests-YYYY-MM-DD.jsonl,
# rotated daily. Leave empty to disable. Records now carry a `provider`
# field so log aggregation can split Claude vs Codex traffic.
log_dir: ./logs

# Days to retain rotated request logs. 0 = keep forever.
log_retention_days: 90

# Minutes of inactivity after which a client session releases its OAuth
# slot. Sessions are scoped per (client_token, provider) so the same
# token using both endpoints has independent stickiness windows.
active_window_minutes: 5

# Default maximum concurrent in-flight requests per client token.
# 0 = unlimited. Per-token overrides (set via admin panel) take
# precedence. Scoped per provider — Claude and Codex each get their own
# bucket. Codex traffic gets 5x this ceiling (chattier, cheaper), so the
# value here is the Claude baseline; Codex effective = value * 5.
client_max_concurrent: 15

# Max pool slots one client token may hold at once per provider. 0 = unlimited.
# Fair-share cap, distinct from client_max_concurrent: a pool slot is what a
# credential's max_concurrent rations, and a codex-tui WebSocket session holds
# one for the whole life of the socket (chatgpt.com keeps these alive up to an
# hour) while an HTTP request holds one for seconds. Without a cap a couple of
# WS users can sit on most of a provider's slot capacity and everyone else gets
# "no credentials available" from a healthy fleet. Only NEW sessions are
# refused; an established one is never torn down. Leave at 0 unless you see WS
# users starving others.
client_max_sessions: 0

# Default sliding 60-second requests-per-minute cap per client token.
# Complements client_max_concurrent: concurrent limits fast bursts while
# this limits sustained volume. 0 = unlimited. Per-token overrides (set
# via admin panel) take precedence. 60 is tuned for heavy Claude Code
# Max 20× use (parallel subagents + tool loops fit comfortably). This is
# the Claude baseline; Codex effective RPM = value * 5.
client_rpm: 60

# Use uTLS (Chrome fingerprint) for all upstream calls. Recommended —
# Anthropic edge fingerprint-checks non-browser clients.
use_utls: true

# Default upstream proxy. Applied to OAuth/API-key entries that do not
# specify one of their own. Empty = direct connection.
default_proxy_url: ""

# Upstream base URLs (normally leave at default).
anthropic_base_url:        "https://api.anthropic.com"
openai_base_url:           "https://api.openai.com"          # BYOK Codex API-key path
chatgpt_backend_base_url:  "https://chatgpt.com/backend-api" # Codex OAuth path

# Admin panel token. Protects the legacy operator API at /admin/api/*
# (used by the SaaS frontend for ops actions; also accepts X-Admin-Token
# or Authorization: Bearer). Leave empty to disable the legacy API.
admin_token: "change-me-long-random-string"

# Pricing table. Keyed by "<provider>/<model>". Built-in defaults cover:
#   Anthropic: claude-haiku-4-5, claude-opus-4-6, claude-opus-4-7,
#              claude-opus-4-8, claude-opus-5, claude-fable-5,
#              claude-sonnet-4-6, claude-sonnet-5
#   OpenAI:    gpt-5.2, gpt-5.3-codex[-spark], gpt-5.4[-mini], gpt-5.5,
#              gpt-5.6-sol, gpt-5.6-terra, gpt-5.6-luna,
#              gpt-5, gpt-5-mini, gpt-5-nano, gpt-4o, gpt-4o-mini
# Bare model keys (no slash) are interpreted as anthropic/<model> for
# backward compatibility with older configs. Unlisted models fall back
# to provider_defaults[provider], then to `default`.
# Fast alias is forwarded as priority. Tier pricing is applied before the
# existing customer multiplier. Defaults: GPT-5.5 2.5x; GPT-5.6/Astra 2x.
# pricing:
#   service_tiers:
#     openai/gpt-5.5:
#       fast_multiplier: 2.5  # must exceed 1; 0 means catalog default
#       flex_multiplier: 0.5
#     openai/gpt-6-astra:
#       fast_multiplier: 2
#   default:
#     input_per_1m: 3.00
#     output_per_1m: 15.00
#     cache_read_per_1m: 0.30
#     cache_create_per_1m: 3.75
#   provider_defaults:
#     openai:
#       input_per_1m: 1.25
#       output_per_1m: 10.00
#       cache_read_per_1m: 0.125
#   models:
#     anthropic/claude-opus-4-7:
#       input_per_1m: 5.0
#       output_per_1m: 25.0
#       cache_read_per_1m: 0.50
#       cache_create_per_1m: 6.25
#     openai/gpt-5.3-codex:
#       input_per_1m: 1.25
#       output_per_1m: 10.0
#       cache_read_per_1m: 0.125

# API-key fallback pool. Used when every OAuth file is saturated or
# unavailable. API keys have no concurrency limit. Same fields are
# editable per-key from the admin panel. Leave as an empty list to
# disable (`api_keys: []`) or remove the stanza entirely.
#
# Each entry writes a file under auth_dir on first load; the admin
# panel can edit the resulting files in-place afterwards.
api_keys:
  # — Anthropic API key (omit `provider` and anthropic is assumed — keeps
  #   older configs working unchanged)
  # - key: "sk-ant-api03-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
  #   provider: anthropic
  #   label: "primary-claude"
  #   proxy_url: ""
  #   base_url: ""          # override upstream host (third-party relays)
  #   group: ""             # public; or e.g. "premium" to scope this key
  #   model_map: {}         # non-empty turns this key model-restricted
  #
  # — OpenAI BYOK key used by the Codex endpoint. Routed to
  #   {base_url}/v1/chat/completions or /v1/responses.
  # - key: "sk-proj-xxxxxxxxxxxxxxxxxxxxxxxx"
  #   provider: openai
  #   label: "openai-primary"
  #   proxy_url: ""
  #   base_url: ""
  #
  # — Third-party Claude relay with a custom base URL + model name rewrite.
  #   model_map both routes (key only accepts listed client-facing model
  #   names) and rewrites the request body's `model` field before
  #   forwarding. Empty value = accept the model name without rewriting.
  # - key: "sk-relayvendor-xxx"
  #   provider: anthropic
  #   label: "relay-A"
  #   base_url: "https://az.zlapi.pro"
  #   group: ""
  #   model_map:
  #     claude-opus-4-6:    "[0.16]稳定喵/claude-opus-4-6"
  #     claude-sonnet-4-6:  "[0.1]高质量喵/claude-sonnet-4-6"
  #     claude-haiku-4-5:   "[aws按量]cf逆/claude-haiku-4-5-20251001"

# ---------------------------------------------------------------------
# SaaS multi-tenant layer (commercial mode).
#
# When enabled, the proxy becomes a self-serve SaaS:
#   - Per-user accounts (register/login with optional email verification)
#   - Per-user API tokens with daily/monthly USD caps
#   - USD wallet billed on every successful response
#   - CNY top-up via Alipay at the live exchange rate
#   - Pricing groups with independent Codex / Claude pegs
#   - Model health page (status-page style) for API-key credentials
#
# When `enabled: false`, the proxy behaves exactly like the OSS build
# and `tokens.json` continues to drive client auth.
# ---------------------------------------------------------------------
saas:
  enabled: false
  # SQLite file for users, tokens, transactions, alipay orders, etc.
  # Created on first start. Relative paths resolve against this file's
  # directory.
  db_path: ./saas.db

  # Daily on-disk snapshots kept in <db_path dir>/backups. These are the
  # local safety net — the off-host encrypted archive (see `backup:` above)
  # is the real one, so a long tail here mostly just costs disk. Default 14.
  local_snapshot_days: 14

  # JWT signing key. Leave empty and the server generates a 32-byte
  # random secret on first start, persisted to <db_path>.jwt_secret.
  jwt_secret: ""
  # Token TTL — defaults to 24h.
  jwt_ttl: 24h

  site_name: HypiToken
  site_url: ""

  # First-run admin bootstrap. Created only when the users table is
  # empty. After the first start these are ignored — change the
  # password from the panel.
  admin_email: admin@example.com
  admin_password: change-me-now-change-me-now

  # Open registration. Set false to require operator-pre-creation.
  free_register: true

  # 姊妹服务（HypiHub 汇枢，图片/视频生成网关）的机器对机器凭证。
  #
  # HypiHub 与本服务共用同一套用户账号和 USD 钱包，但它不会直接打开 saas.db
  # ——第二个进程写同一个 SQLite 会和迁移器抢锁、并绕开本仓库 _txlock=immediate
  # 的写入纪律。它改为用同一个 HS256 密钥离线校验 hypitoken 签发的 JWT，再通过
  # /api/v2/svc/* 这组接口扣款/退款。请求头 X-Service-Token 携带下面任意一条。
  #
  # ⚠️ 这不是用户凭证：持有者可以对**任意** workspace 扣款。必须当作数据库密码
  #    对待，并且 /api/v2/svc/ 绝对不能暴露到公网 —— 请在 Caddy/Nginx 反代层
  #    直接拦掉该前缀，只允许内网（同机 127.0.0.1 或私有网段）访问。
  #
  # 留空（默认）时整个 /api/v2/svc 路由组根本不会挂载，不跑 HypiHub 的部署无需
  # 关心这一项。每条可写成三种形式：明文 token、"sha256:<64位hex>"（配置文件里
  # 不留明文）、或 "@/path/to/file"（从文件读，一行一条）——与
  # trusted_relay_tokens、支付网关密钥的约定一致。
  service_tokens: []
  # service_tokens:
  #   - "sha256:3b1f...64位hex..."
  #   - "@/etc/hypitoken/hypihub.token"

  # 跨站单点登录：允许把本站会话交接过去的 origin 白名单（**精确比对**）。
  #
  # 姊妹站 HypiHub（汇枢）跑在 hub.novadiffusion.com，与本站 api.novadiffusion.com
  # **不同源**：localStorage 不共享、也没有跨这两个域的 cookie，所以用户在本站登录后
  # 到那边仍然是未登录状态。解决办法是一次性交接码：浏览器带着 ?return= 回到本站，
  # 本站签发一枚 120 秒的一次性 code，浏览器把它带过去，HypiHub 后端再拿 code 到
  # /api/v2/svc/sso/redeem 换一枚正常 JWT。
  #
  # ⚠️ 这一项就是整个功能的安全边界。/api/v2/auth/sso/code 收到的 return_url 来自
  #    浏览器（也就是可能来自攻击者），而它换到的 code 在这 120 秒里**等价于该用户的
  #    密码**。把 code 送到攻击者的站点 = 账号完全失陷。
  #
  # ⚠️ 因此这里是「归一化 origin 的精确字符串相等」，不做也永远不要改成前缀匹配、
  #    后缀匹配或通配子域 —— 那些全都是**开放重定向**：
  #      - 前缀匹配 "https://apihub.hypit.ai" 会放行
  #        "https://apihub.hypit.ai.evil.com"（把域名接在后面即可）；
  #      - 通配 "*.hypit.ai" 会放行攻击者能拿到 CNAME 的任意子域。
  #    配置里写通配符会在**启动时直接 fatal**，不会被静默忽略。
  #
  # 每条只写 origin：scheme://host[:port]，不带 path / query / fragment，也不带
  # 用户名密码。大小写和默认端口会被归一化（https://x.com:443 == https://x.com），
  # 其余一律严格：http 与 https 是两个 origin，不同端口是两个 origin，子域不继承。
  # 写错任意一条 = 启动 fatal（宁可起不来，也不要一个悄悄少了一行的白名单）。
  #
  # 留空（默认）时 POST /api/v2/auth/sso/code 根本不会挂载，不跑 HypiHub 的部署
  # 无需关心这一项。（换取 JWT 的 /api/v2/svc/sso/redeem 属于上面的 svc 路由组，
  # 由 service_tokens 单独控制。）
  sso_return_origins: []
  # sso_return_origins:
  #   - "https://apihub.hypit.ai"

  # 跨站充值回跳：允许 POST /api/v2/topup 的 return_url 指向的 origin 白名单
  # （**精确比对**）。
  #
  # 姊妹站 HypiHub（汇枢）与本站共用同一个钱包和同一本账，充值页也做在它自己的
  # 站内：浏览器把 /api/v2/topup 代理过来，本站创建 Stripe Checkout 并把
  # client_secret 交回去，由 HypiHub 自己渲染 Payment Element。走支付宝/微信这类
  # **需要跳转**的支付方式时，付完款浏览器要回到发起充值的那一页 —— 默认回的是本站
  # /app/billing，配了这一项之后才允许回到 HypiHub。
  #
  # ⚠️ 这一项是本功能唯一的安全边界。return_url 来自浏览器（也就是可能来自攻击者），
  #    带回去的是一条支付回执通道（?out=<订单号>）。因此这里只做「归一化 origin 的
  #    精确字符串相等」，绝不做前缀匹配、后缀匹配或通配子域 —— 那些全是**开放重定向**：
  #      - 前缀匹配 "https://apihub.hypit.ai" 会放行
  #        "https://apihub.hypit.ai.evil.com"；
  #      - 通配 "*.hypit.ai" 会放行攻击者能拿到 CNAME 的任意子域。
  #    配置里写通配符会在**启动时直接 fatal**，不会被静默忽略。
  #
  # ⚠️ 钱只从本站进。HypiHub 没有 Stripe 密钥、没有 webhook、没有订单表、也没有任何
  #    加钱的路径；它只是转发充值意图并渲染表单。结算与入账仍然只有本站这一条路径，
  #    「webhook 与轮询抢跑」的去重是**进程内**判断，多一个入账进程就会真的重复入账。
  #
  # 每条只写 origin：scheme://host[:port]，不带 path / query / fragment。大小写与
  # 默认端口会被归一化（https://x.com:443 == https://x.com），其余一律严格：http 与
  # https 是两个 origin，不同端口是两个 origin，子域不继承，结尾多一个点也不相等。
  #
  # **与上面的 sso_return_origins 是两个独立的键，故意不复用**：那一项交接的是等价于
  # 密码的会话码，这一项是支付路径上的回跳目标，两者授权的东西不同、应当能分别开关。
  # 留空（默认）时，带 return_url 的充值请求一律 400，行为与今天逐字节一致。
  topup_return_origins: []
  # topup_return_origins:
  #   - "https://apihub.hypit.ai"

  # Maximum USD a user wallet may be driven negative by in-flight requests
  # (one large request, or many concurrent ones, can each pass the balance>0
  # check and then bill against a near-zero balance). Charges are clamped so the
  # wallet never rests below -max_overdraft_usd. Omit for the default ($10); set
  # 0 to disable the floor (unbounded negative — not recommended).
  max_overdraft_usd: 10

  # Payment gateway: zpay | alipay | mock. Empty = inferred from whichever
  # block below is configured (zpay → alipay → mock). The mock gateway
  # auto-confirms every top-up after 2s WITHOUT taking real money, and is
  # hard-refused at startup on a public site (non-local site_url). For a real
  # deployment configure zpay or alipay; set allow_mock_payment: true only to
  # deliberately run the auto-confirm mock on a public host (testing).
  payment_provider: ""
  allow_mock_payment: false

  # Outbound mail. Empty host = log-only mailer (verification codes
  # appear in server logs — useful for development).
  smtp:
    host: ""
    port: 587
    username: ""
    password: ""
    from: ""
    use_tls: true

  # Alipay gateway. With no gateway configured the server falls back to the
  # mock (auto-confirm) gateway — allowed only on a local site_url (or with
  # allow_mock_payment: true). Useful for local dev without sandbox credentials.
  alipay:
    app_id: ""
    private_key: ""        # PEM string or @/path/to/file
    alipay_public_key: ""  # PEM string or @/path/to/file
    is_production: false
    notify_url: ""         # public URL for Alipay webhooks
    return_url: ""         # browser redirect after pay

  # Stripe Payment Element top-up surface. Runs *alongside* the QR gateway
  # above (zpay/alipay), not instead of it. Secret fields accept @path so the
  # secret stays out of this file. The poll path settles orders even without a
  # delivered webhook, so webhook_secret is optional in local dev.
  stripe:
    enabled: false
    secret_key: ""          # sk_(test|live)_… or @/path/to/file
    publishable_key: ""     # pk_(test|live)_… (public, handed to the browser)
    webhook_secret: ""      # whsec_… or @/path/to/file (optional)
    # Line-item currency for the Checkout Session; the wallet is credited 1:1 in
    # this currency. Keep "usd" — Adaptive Pricing is off, so the buyer is
    # charged in this currency outright and Alipay does its own FX at its bank
    # rate instead of Stripe's 2-4% conversion fee.
    currency: "usd"
    # Pin the exact rails offered at checkout, in order. Leave unset for dynamic
    # payment methods, where Stripe.js decides per buyer which of the account's
    # enabled rails to render from IP + browser signals — that filter silently
    # drops the Alipay tab for a buyer whose network doesn't geolocate to China,
    # and no API parameter overrides it. Listing them turns the filter off; the
    # first entry is the preselected tab. Mutually exclusive with
    # payment_method_configuration (this wins).
    payment_method_types: ["alipay", "card"]
    # payment_method_configuration: ""  # pmc_… (ignored when the list above is set)
    # return_url: ""        # redirect-method return; default <site_url>/app/billing

  # Live USD/CNY rate source. Default is the public fawazahmed0
  # currency-api (no key, no rate limit). Refreshed every hour.
  exchange_rate_url: ""
  fallback_cny_per_usd: 7.2

  # Background API-key health checker cadence.
  health_check_interval: 30m

# -----------------------------------------------------------------------
# Shop — standalone storefront on its own listener.
# Independent of SaaS: buyers identify by email + a self-chosen query
# password (no accounts). Set endpoints.shop.disabled=false to bind the
# listener and shop.enabled=true to wire the routes.
# -----------------------------------------------------------------------
shop:
  enabled: false

  # SQLite file holding products + card pools + orders. Relative to the
  # dir of this config. Default: shop.db.
  db_path: shop.db

  # Site identity — shown in emails and the page header.
  site_name: "Nova Shop"
  site_url: "https://shop.example.com"

  # Prefix the buyer's browser lands on after paying. The shop appends
  # /<out_trade_no>. Defaults to <site_url>/order if empty.
  return_url_prefix: "https://shop.example.com/order"

  # Pending orders older than this are marked expired by a background
  # sweeper. Late notifications against expired orders are rejected.
  order_ttl: 30m

  # Stripe hosted Checkout — the active payment gateway (card + Alipay).
  # The storefront redirects buyers to a Stripe-hosted page; settlement
  # lands via the webhook below plus a poll fallback. May reuse the SaaS
  # account's secret_key, but MUST use its own webhook endpoint secret
  # (create a separate webhook endpoint → https://shop.example.com/stripe/webhook).
  stripe:
    enabled: true
    secret_key: "@/etc/hypitoken/stripe_secret_key"     # sk_live_… or @/path
    webhook_secret: "@/etc/hypitoken/shop_stripe_webhook_secret"  # whsec_… or @/path
    # Products are priced in CNY; charging CNY directly makes Alipay natively
    # eligible (card works in any currency). No Adaptive Pricing needed.
    currency: "cny"
    # Where Stripe sends the buyer on success. Stripe appends the session id.
    # Defaults to return_url_prefix (then <site_url>/order) if empty.
    success_url_prefix: "https://shop.example.com/order"

  # Z-Pay merchant — retained for config back-compat; the shop now collects
  # via Stripe (above). Leave blank unless re-enabling the legacy gateway.
  zpay:
    base_url: "https://zpayz.cn"
    pid: ""
    key: ""

  # Outbound SMTP for order delivery emails. Pointing host at
  # smtp.resend.com effectively makes this a Resend setup.
  smtp:
    host: ""
    port: 587
    username: ""
    password: ""
    from: "support@example.com"
    use_tls: true

# ---------------------------------------------------------------------------
# Off-host disaster-recovery backup (the `backup` subcommand + systemd timer).
# Daily, the binary snapshots the critical state (saas.db + jwt_secret, shop.db,
# tokens.json, auths/, config.yaml, payment secrets), encrypts it
# to an X25519 PUBLIC key, and uploads it to an S3-compatible bucket as
# <prefix>YYYY-MM-DD.tar.gz.enc, pruning anything older than retention_days.
#
# The private key NEVER lives on the server — generate a keypair with
#   hypitoken backup keygen
# put the PUBLIC key in recipient_pubkey below, store the PRIVATE key OFFLINE
# (password manager + paper). Without the private key a server/bucket breach
# cannot read backups; but losing it makes the backups unrecoverable.
backup:
  enabled: false
  retention_days: 7
  recipient_pubkey: ""          # base64 X25519 public key from `backup keygen`
  s3:
    endpoint: "s3.bitiful.net"  # Bitiful S3-compatible endpoint (host only)
    region: "cn-east-1"
    bucket: "apibackup"
    prefix: "hypitoken/"        # namespaces this app inside the shared bucket
    # Use a LEAST-PRIVILEGE key (PutObject + ListBucket + DeleteObject; NO
    # GetObject). @/path keeps the secret out of this file.
    access_key_id: "@/etc/hypitoken/s3_key_id"
    secret_access_key: "@/etc/hypitoken/s3_secret"

# Emulate the auxiliary traffic a real Codex client emits alongside its turns —
# the plugin store, MCP discovery, the model catalog, user settings, analytics
# and OTLP metrics. Off by default.
#
# The default is a real trade-off, not a placeholder. An account that emits only
# business requests looks unlike a desktop install; an account that emits
# auxiliary traffic we got subtly wrong looks unlike anything at all. Analytics
# events can only be built from the ids of a turn that actually happened, and
# per-account attributes vary, so the second failure cannot happen quietly — but
# it is new, so enable it deliberately.
codex_sidecar:
  enabled: false
